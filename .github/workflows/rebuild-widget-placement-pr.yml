name: Rebuild widget placement PR

on:
  pull_request_target:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.number == 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/widget-surface-placement
          fetch-depth: 0
      - name: Rebuild feature on current main
        id: rebuild
        continue-on-error: true
        run: |
          set -o pipefail
          git fetch origin main backup/widget-surface-placement-pre-rebase
          git diff --binary 0bda846db8bb91ba93c3ccb85ca219a1afd6a4e4..origin/backup/widget-surface-placement-pre-rebase \
            -- . ':(exclude).github/workflows/rebase-widget-surface-placement.yml' \
            > /tmp/widget-placement.patch
          git reset --hard origin/main
          if git apply --3way --index /tmp/widget-placement.patch; then
            echo success=true >> "$GITHUB_OUTPUT"
          else
            git status --short > /tmp/rebase-status.txt
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git diff > /tmp/conflict-diff.txt
            echo success=false >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Upload conflict diagnostics
        if: steps.rebuild.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: widget-placement-rebase-conflicts
          path: |
            /tmp/rebase-status.txt
            /tmp/conflicts.txt
            /tmp/conflict-diff.txt
      - name: Validate and publish
        if: steps.rebuild.outcome == 'success'
        run: |
          git diff --cached --check
          bash scripts/check-translations.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add per-widget surface placement"
          git push --force origin HEAD:agent/widget-surface-placement
