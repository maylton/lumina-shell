name: Apply Bluetooth state verification

on:
  push:
    branches:
      - agent/notification-anchor-geometry

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/notification-anchor-geometry
          fetch-depth: 0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq ripgrep \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qttest

      - name: Apply guarded migration
        run: python3 scripts/apply-bluetooth-state-verification.py

      - name: Validate translations
        run: bash scripts/check-translations.sh

      - name: Test connectivity parsing
        run: |
          QT_QPA_PLATFORM=offscreen \
            /usr/lib/qt6/bin/qmltestrunner \
            -input tests/tst_connectivity_parsing.qml

      - name: Commit Bluetooth fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/connectivity/ConnectivityManagerService.qml \
            services/connectivity/ConnectivityParsing.js \
            modules/control/settings/pages/connectivity/BluetoothPage.qml \
            services/i18n/ConnectivityMessages.js \
            services/i18n/I18n.qml \
            tests/tst_connectivity_parsing.qml
          git commit -m "Verify Bluetooth state before reporting success"
          git push origin HEAD:agent/notification-anchor-geometry
