            }
        }
    }

    Rectangle {
        anchors.fill: parent
        radius: root.radius
        color: root.withAlpha(
            root.tintColor,
            ShellSurfacePolicy.tintAlpha(
                root.backgroundMode,
                root.configuredOpacity,
                Theme.lightMode
            )
        )

        Behavior on color {
            ColorAnimation {
                duration: root.luminaDesign.motion.effectsDefault
                easing.type: root.luminaDesign.motion.effectsEasing
            }
        }
    }

    Rectangle {
        anchors.fill: parent
        radius: root.radius
        color: root.withAlpha(
            Theme.surfaceBaseColor,
            ShellSurfacePolicy.contrastProtectionAlpha(
                root.backgroundMode,
                Theme.lightMode
            )
        )

        Behavior on color {
            ColorAnimation {
                duration: root.luminaDesign.motion.effectsDefault
                easing.type: root.luminaDesign.motion.effectsEasing
            }
        }
    }

    Rectangle {
        anchors.fill: parent
        visible: opacity > 0
        opacity: ShellSurfacePolicy.highlightAlpha(
            root.backgroundMode,
            Theme.lightMode
        )
        radius: root.radius
        color: "transparent"
        gradient: Gradient {
            orientation: Gradient.Horizontal

            GradientStop {
                position: 0
                color: root.highlightColor
            }

            GradientStop {
                position: 0.42
                color: root.withAlpha(root.highlightColor, 0.22)
            }

            GradientStop {
                position: 1
                color: "transparent"
            }
        }

        Behavior on opacity {
            NumberAnimation {
                duration: root.luminaDesign.motion.effectsDefault
                easing.type: root.luminaDesign.motion.effectsEasing
            }
        }
    }

    Image {
        anchors {
            fill: parent
            margins: Math.max(2, Math.round(root.radius * 0.38))
        }
        visible: opacity > 0
        opacity: ShellSurfacePolicy.grainAlpha(
            root.backgroundMode,
            Theme.lightMode
        )
        source: root.frostedNoiseSource
        sourceSize.width: 160
        sourceSize.height: 128
        fillMode: Image.Tile
        smooth: false
        asynchronous: true

        Behavior on opacity {
            NumberAnimation {
                duration: root.luminaDesign.motion.effectsDefault
                easing.type: root.luminaDesign.motion.effectsEasing
            }
        }
    }

    Item {
        id: content

        anchors.fill: parent
        z: 10
    }

    Rectangle {
        anchors.fill: parent
        z: 20
        radius: root.radius
        color: "transparent"
        border.width: 1
        border.color: root.withAlpha(
            root.luminaDesign.color.outline,
            ShellSurfacePolicy.borderAlpha(root.backgroundMode)
        )

        Behavior on border.color {
            ColorAnimation {
                duration: root.luminaDesign.motion.effectsDefault
                easing.type: root.luminaDesign.motion.effectsEasing
            }
        }
    }
}
'''

