name: Apply widget surface placement

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Decode the migration
        run: |
          base64 --decode scripts/apply-widget-surface-placement.py.gz.b64 \
            | gzip --decompress \
            > scripts/apply-widget-surface-placement.py
          chmod +x scripts/apply-widget-surface-placement.py

      - name: Patch precise surface roots
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-widget-surface-placement.py")
          source = path.read_text()

          wallpaper_old = (
              "        text = replace_once(\n"
              "            text,\n"
              '            "                    anchors.centerIn: parent\\n",\n'
              '            fullscreen_position_block("pickerWindow", "pickerSurface", "root.luminaDesign.spacing.extraLarge"),\n'
              '            "Wallpaper surface position",\n'
              "        )\n"
          )
          wallpaper_new = (
              "        text = replace_once(\n"
              "            text,\n"
              '            """                Rectangle {\n'
              "                    id: pickerSurface\n"
              "\n"
              "                    anchors.centerIn: parent\n"
              '""",\n'
              '            """                Rectangle {\n'
              "                    id: pickerSurface\n"
              "\n"
              '"""\n'
              "            + fullscreen_position_block(\n"
              '                "pickerWindow",\n'
              '                "pickerSurface",\n'
              '                "root.luminaDesign.spacing.extraLarge"\n'
              "            ),\n"
              '            "Wallpaper surface position",\n'
              "        )\n"
          )
          session_old = (
              "        text = replace_once(\n"
              "            text,\n"
              '            "                    anchors.centerIn: parent\\n",\n'
              '            fullscreen_position_block("sessionWindow", "menuSurface", "root.luminaDesign.spacing.extraLarge"),\n'
              '            "Session surface position",\n'
              "        )\n"
          )
          session_new = (
              "        text = replace_once(\n"
              "            text,\n"
              '            """                Rectangle {\n'
              "                    id: menuSurface\n"
              "\n"
              "                    anchors.centerIn: parent\n"
              '""",\n'
              '            """                Rectangle {\n'
              "                    id: menuSurface\n"
              "\n"
              '"""\n'
              "            + fullscreen_position_block(\n"
              '                "sessionWindow",\n'
              '                "menuSurface",\n'
              '                "root.luminaDesign.spacing.extraLarge"\n'
              "            ),\n"
              '            "Session surface position",\n'
              "        )\n"
          )

          if source.count(wallpaper_old) != 1:
              raise SystemExit("wallpaper migration block was not unique")
          if source.count(session_old) != 1:
              raise SystemExit("session migration block was not unique")

          source = source.replace(wallpaper_old, wallpaper_new, 1)
          source = source.replace(session_old, session_new, 1)
          path.write_text(source)
          PY
          python -m py_compile scripts/apply-widget-surface-placement.py

      - name: Apply the implementation
        id: migration
        continue-on-error: true
        run: |
          python scripts/apply-widget-surface-placement.py \
            > /tmp/widget-surface-placement.log 2>&1
          cat /tmp/widget-surface-placement.log

      - name: Upload migration diagnostics
        if: steps.migration.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: widget-surface-placement-diagnostics
          path: /tmp/widget-surface-placement.log
          if-no-files-found: error

      - name: Stop after migration failure
        if: steps.migration.outcome == 'failure'
        run: exit 1

      - name: Validate the generated implementation
        if: steps.migration.outcome == 'success'
        run: |
          python scripts/apply-widget-surface-placement.py --check
          git diff --check
          bash scripts/check-translations.sh

      - name: Commit and push the implementation
        if: steps.migration.outcome == 'success'
        run: |
          rm scripts/apply-widget-surface-placement.py
          rm -f scripts/widget-surface-placement-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Add per-widget surface placement"
          git push origin "HEAD:${{ github.head_ref }}"
