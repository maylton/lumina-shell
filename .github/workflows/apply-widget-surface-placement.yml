name: Apply widget surface placement

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Decode and correct the migration
        run: |
          base64 --decode scripts/apply-widget-surface-placement.py.gz.b64 \
            | gzip --decompress \
            > scripts/apply-widget-surface-placement.py
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-widget-surface-placement.py")
          source = path.read_text()
          old = 'text = text.replace("trayPopup.toggle()", "root.togglePopup(groupButton.width / 2)", 3)'
          new = 'text = text.replace("trayPopup.toggle()", "root.togglePopup(groupButton.width / 2)", 2)'
          if source.count(old) != 1:
              raise SystemExit("tray replacement count patch was not unique")
          path.write_text(source.replace(old, new, 1))
          PY
          chmod +x scripts/apply-widget-surface-placement.py
          python -m py_compile scripts/apply-widget-surface-placement.py

      - name: Apply the implementation
        id: migration
        continue-on-error: true
        run: |
          python scripts/apply-widget-surface-placement.py \
            > /tmp/widget-surface-placement.log 2>&1
          cat /tmp/widget-surface-placement.log

      - name: Upload migration log
        uses: actions/upload-artifact@v4
        with:
          name: widget-surface-placement-run-log
          path: /tmp/widget-surface-placement.log

      - name: Stop after migration failure
        if: steps.migration.outcome == 'failure'
        run: exit 1

      - name: Validate the generated implementation
        run: |
          python scripts/apply-widget-surface-placement.py --check
          git diff --check
          bash scripts/check-translations.sh

      - name: Commit and push the implementation
        run: |
          rm scripts/apply-widget-surface-placement.py
          rm scripts/apply-widget-surface-placement.py.gz.b64
          rm .github/workflows/apply-widget-surface-placement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add per-widget surface placement"
          git push origin "HEAD:${{ github.head_ref }}"
