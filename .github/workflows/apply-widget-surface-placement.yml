name: Apply widget surface placement

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Decode migration and capture schema context
        run: |
          base64 --decode scripts/apply-widget-surface-placement.py.gz.b64 \
            | gzip --decompress \
            > scripts/apply-widget-surface-placement.py
          sed -n '95,170p' scripts/apply-widget-surface-placement.py > /tmp/schema-script.log
          sed -n '1,260p' stores/config/ConfigSchema.js > /tmp/config-schema.log

      - name: Upload schema context
        uses: actions/upload-artifact@v4
        with:
          name: config-schema-migration-context
          path: |
            /tmp/schema-script.log
            /tmp/config-schema.log

      - name: Stop after context capture
        run: exit 1
